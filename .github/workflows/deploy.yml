name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys so a quick second push doesn't race the first one
# halfway through `make prod-up`.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-/root/photogrid-studio}"
            git fetch --prune origin
            git reset --hard origin/main
            make prod-up
