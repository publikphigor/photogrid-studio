services:
  backend:
    # --timeout 600: gunicorn's 30s default SIGKILLs workers mid-render on big exports.
    # --graceful-timeout 600 + stop_grace_period: in-flight renders finish during a deploy.
    command: ["gunicorn", "-k", "uvicorn.workers.UvicornWorker", "-w", "${WEB_CONCURRENCY:-4}", "--timeout", "600", "--graceful-timeout", "600", "-b", "0.0.0.0:8000", "--access-logfile", "-", "--error-logfile", "-", "photogrid.main:app"]
    stop_grace_period: 600s
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "4.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
